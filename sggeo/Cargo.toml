[package]
name = "sggeo"
version = "0.4.0"
edition = "2024"
description = "Geometry model, constraint solver, and closed-form formula derivation for 2D geometric constructions"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
web-time = "1.1"
# typesets formulas as PNG images (ops::latex_png); the workspace takes the vendored copy
latex-rust = { version = "3.0.3", default-features = false, features = ["std", "png"] }
# the Python module (src/py.rs), with the `python` feature
pyo3 = { version = "0.30", features = ["abi3-py39"], optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2.130"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
# builds the library as the Python extension module `sggeo` (see pyproject.toml)
python = ["dep:pyo3", "pyo3/extension-module"]
